# zaelyn-portal · CI (Estándar NE Producto): tipos y build en cada PR a main.
# Pruebas con `node --test` (sin dependencias; Node 22 para leer TypeScript). El build no necesita secretos: sin ZAELYN_API el portal compila y
# muestra el modo «sin conectar».
name: CI
on:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
